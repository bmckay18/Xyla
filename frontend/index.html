<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="https://ka-f.webawesome.com/webawesome@3.10.0/styles/webawesome.css" />
    <script type="module" src="https://ka-f.webawesome.com/webawesome@3.10.0/webawesome.loader.js"></script>

    <link rel="stylesheet" href="./src/style.css" />
    <link rel="stylesheet" href="./src/pages/home/home-styles.css" />
  </head>
  <body>
    <div class="header">
      <a href="lobby.html">Home</a>
    </div>

    <div class="lobby-selection">
      <h1>Create A Lobby</h1>
      <form id="create-lobby-form">
        <wa-input name="displayName" label="Display Name"></wa-input>
        <wa-input name="password" label="Password" hint="Leave blank for no password"></wa-input>

        <wa-button variant="success" type="submit" id="create-lobby-button">Create Lobby</wa-button>
      </form>

      <h1>Join A Lobby</h1>

      <form id="join-lobby-form">
        <wa-input name="displayName" label="Display Name"></wa-input>
        <wa-input name="lobbyId" label="Lobby ID"></wa-input>
        <wa-input name="password" label="Password"></wa-input>

        <wa-button variant="success" type="submit">Join Lobby</wa-button>
      </form>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
